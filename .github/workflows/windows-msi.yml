name: Windows MSI packaging and verification
on:
  workflow_dispatch:
    inputs:
      payload_run:
        description: 'Run with successful core/native tests and a windows-msi-payload artifact'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  msi:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Retrieve previously tested native application
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_RUN: ${{ inputs.payload_run }}
        run: |
          if($env:PAYLOAD_RUN -notmatch '^\d+$'){throw 'Invalid payload run'}
          $info = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PAYLOAD_RUN/jobs" | ConvertFrom-Json
          foreach($name in @('Check core on Windows','Windows processing and UI checks')) {
            $steps = @($info.jobs.steps | Where-Object { $_.name -eq $name -and $_.conclusion -eq 'success' })
            if($steps.Count -ne 1){throw "Required payload test not successful: $name"}
          }
          gh run download $env:PAYLOAD_RUN --repo $env:GITHUB_REPOSITORY --name windows-msi-payload --dir build/windows-publish
          if($LASTEXITCODE -ne 0){throw 'Payload unavailable'}
      - name: Install pinned MSI build tools
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path build/wix-tools
          if($LASTEXITCODE -ne 0){throw 'WiX restore failed'}
          build/wix-tools/wix.exe extension add WixToolset.UI.wixext/5.0.2
          if($LASTEXITCODE -ne 0){throw 'WiX UI restore failed'}
      - name: Build MSI
        run: ./scripts/package-windows-msi.ps1
      - name: Install, test, repair and uninstall MSI
        run: ./scripts/test-windows-msi.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-msi-qa
          path: |
            build/installed-qa
            build/msi-install.log
            build/windows-installer/*.wxs
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-msi-x64
          path: build/windows-installer/*.msi
          retention-days: 14
