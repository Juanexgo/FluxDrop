name: Web checks
on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/release-manifest/**', 'scripts/check-web.mjs', '.github/workflows/web.yml']
  pull_request:
    paths: ['apps/web/**', 'packages/release-manifest/**', 'scripts/check-web.mjs', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run check
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: node scripts/check-web.mjs
